# ── JVM / Gradle Daemon ──────────────────────────────────────────────────────
# Aumentado de 2GB para 4GB — necessário para compilar KMP + WasmJS + Android
org.gradle.jvmargs=-Xmx4096M -Xms512M -XX:+UseG1GC -XX:MaxMetaspaceSize=512M -Dfile.encoding=UTF-8

# Kotlin compiler daemon também precisa de mais memória
kotlin.daemon.jvm.options=-Xmx3072M -Xms256M -XX:+UseG1GC

# ── Build performance ─────────────────────────────────────────────────────────
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.workers.max=2

# Configuration cache ajuda em rebuilds, mas pode causar problemas com alguns plugins
# Desativado para evitar conflitos — reative se quiser testar
org.gradle.configuration-cache=false

# Incremental compilation
kotlin.incremental=true
kotlin.incremental.multiplatform=true

# Evita re-compilar o que não mudou
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000

# ── Kotlin ────────────────────────────────────────────────────────────────────
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

# Wasm/JS — usa worker separado para não disputar memória com Android
kotlin.js.webpack.major.version=5

# ── Android ───────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true

# Evita processar recursos desnecessários no desenvolvimento
android.enableJetifier=false
